<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Detalle de producto — INFAME Soluciones Culinarias."
    >

    <meta name="author" content="Sierra Remote Studio">

    <title>Producto | INFAME Soluciones Culinarias</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!--
        INFAME Soluciones Culinarias
        Ficha de producto
        Diseño y desarrollo: Sierra Remote Studio
        © 2026 Sierra Remote Studio
    -->

    <header class="site-header">

    <div class="nav-shell">

        <a
            class="brand"
            href="index.html"
            aria-label="INFAME - Inicio"
        >
            <img
                class="brand-logo"
                src="assets/logo/infame-logo-principal.png"
                alt="INFAME Soluciones Culinarias"
            >
        </a>


        <nav
            class="main-nav"
            aria-label="Navegación principal"
        >

            <a href="index.html#inicio">
                Inicio
            </a>

            <a
                class="active"
                href="index.html#productos"
            >
                Productos
            </a>

            <a href="index.html#negocios">
                Negocios
            </a>

            <a href="index.html#mayoristas">
                Mayoristas
            </a>

            <a href="index.html#contacto">
                Contacto
            </a>

        </nav>


        <button
            class="menu-toggle"
            id="menu-toggle"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>


    <nav
        class="mobile-nav"
        id="mobile-nav"
        aria-label="Navegación móvil"
    >

        <a href="index.html#inicio">
            Inicio
        </a>

        <a
            class="active"
            href="index.html#productos"
        >
            Productos
        </a>

        <a href="index.html#negocios">
            Negocios
        </a>

        <a href="index.html#mayoristas">
            Mayoristas
        </a>

        <a href="index.html#contacto">
            Contacto
        </a>

    </nav>

</header>


    <main>

        <section class="product-detail-section">

            <div class="container product-detail">

                <div class="product-detail-image">
                    <img
                        id="detalle-imagen"
                        src=""
                        alt=""
                    >
                </div>


                <div class="product-detail-info">

                    <span
                        class="section-kicker"
                        id="detalle-categoria"
                    ></span>

                    <h1 id="detalle-nombre"></h1>

                    <p
                        class="product-detail-feature"
                        id="detalle-caracteristica"
                    ></p>

                    <p
                        class="product-detail-description"
                        id="detalle-descripcion"
                    ></p>


                    <div class="product-detail-data">

                        <p>
                            Presentación:
                            <strong id="detalle-presentacion"></strong>
                        </p>

                        <p
                            class="product-detail-price"
                            id="detalle-precio"
                        ></p>

                    </div>


                    <div class="product-detail-actions">

                        <a
                            class="primary-button"
                            href="index.html#contacto"
                        >
                            CONSULTAR PRODUCTO
                            <span>→</span>
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="container footer-content">

            <div class="footer-brand">
                <strong>INFAME</strong>
                <span>SOLUCIONES CULINARIAS</span>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-legal">
                <p>© 2026 INFAME Soluciones Culinarias</p>
                <p>
                    Diseño y desarrollo digital por
                    <span class="studio-credit">
                        Sierra Remote Studio
                    </span>
                </p>
            </div>

        </div>

    </footer>


    <script src="js/productos.js"></script>
    <script src="js/producto-detalle.js"></script>

</body>
</html>
